[project]
name = "swarmshield"
version = "0.1.0"
description = "Simulation testbed for prompt infection and memory poisoning in multi-agent LLM systems"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["swarmshield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# The app adds the repository root to sys.path before importing the project packages.
"dashboard/app.py" = ["E402"]
